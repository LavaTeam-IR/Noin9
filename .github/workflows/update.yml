name: noin9 - Update Telegram Channels

on:
  schedule:
    - cron: "*/5 * * * *"   # هر ۵ دقیقه (توجه: گیت‌هاب گاهی چند دقیقه تاخیر داره)
  workflow_dispatch: {}       # امکان اجرای دستی از تب Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "media/" "config/"
          git diff --staged --quiet || git commit -m "بروزرسانی خودکار کانال‌ها [skip ci]"
          git push
